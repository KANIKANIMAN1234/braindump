<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainDump</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>

  <!-- LIFF初期化中のローディング画面 -->
  <div id="loading-overlay" style="
    position: fixed; inset: 0;
    background: #075e54;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999; color: #fff; gap: 1rem;
  ">
    <div style="font-size: 2.5rem;">🤖</div>
    <div style="font-size: 1.1rem; font-weight: 600;">BrainDump</div>
    <div style="font-size: 0.9rem; opacity: 0.8;">読み込み中...</div>
  </div>

  <div class="chat-wrap">

    <header class="chat-header">
      <div class="header-brand">
        <div class="header-avatar">🤖</div>
        <div class="header-info">
          <div class="header-name">BrainDump</div>
          <div class="header-sub">Supabase × OpenAI</div>
        </div>
      </div>
      <div class="header-right">
        <button type="button" id="btn-org-admin" class="header-admin-btn" hidden title="組織・招待管理">⚙️</button>
        <span class="header-org-name" id="header-org-name" hidden title=""></span>
        <span class="header-user-name" id="header-user-name"></span>
        <img class="header-user-icon" id="header-user-icon" src="" alt="" style="display:none;" />
      </div>
    </header>

    <main class="chat-body" id="chat-body">
    </main>

    <div class="quick-actions">
      <button class="qa-btn" id="qa-task">＋ タスク追加</button>
      <button class="qa-btn" id="qa-list">📋 タスク一覧</button>
      <button class="qa-btn" id="qa-complete">✅ タスク完了</button>
      <button class="qa-btn" id="qa-insight">💡 気づき追加</button>
      <button class="qa-btn" id="qa-prompt">✨ プロンプト追加</button>
      <button class="qa-btn" id="qa-export">📤 気づきエクスポート</button>
      <button class="qa-btn" id="qa-update-priority">🔄 優先度修正</button>
      <button class="qa-btn" id="qa-update-due">📅 期日修正</button>
    </div>

    <footer class="chat-footer">
      <textarea
        id="user-input"
        class="chat-input"
        placeholder="メッセージを入力..."
        rows="1"
      ></textarea>
      <button id="mic-btn" class="mic-btn" aria-label="音声入力" title="音声入力">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1 1.93c-3.94-.49-7-3.85-7-7.93H2c0 4.97 3.59 9.1 8.35 9.84V21h3v-2.23C18.41 18.1 22 13.97 22 9h-2c0 4.08-3.06 7.44-7 7.93V15.93z"/>
        </svg>
      </button>
      <button id="send-btn" class="send-btn" aria-label="送信">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </footer>

  </div>

  <div id="org-overlay" class="org-overlay" hidden>
    <div id="org-panel" class="org-panel"></div>
  </div>

  <script src="org-admin.js?v=2"></script>
  <script src="main.js?v=14"></script>
</body>
</html>
