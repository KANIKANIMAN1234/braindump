<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainDump</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

  <!-- LIFF初期化中のローディング画面 -->
  <div id="loading-overlay" style="
    position: fixed; inset: 0;
    background: #075e54;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999; color: #fff; gap: 1rem;
  ">
    <div style="font-size: 2.5rem;">🤖</div>
    <div style="font-size: 1.1rem; font-weight: 600;">BrainDump</div>
    <div style="font-size: 0.9rem; opacity: 0.8;">読み込み中...</div>
  </div>

  <div class="chat-wrap">

    <header class="chat-header">
      <div class="header-avatar">🤖</div>
      <div class="header-info">
        <div class="header-name">BrainDump</div>
        <div class="header-sub">Supabase × OpenAI</div>
      </div>
    </header>

    <main class="chat-body" id="chat-body">
    </main>

    <div class="quick-actions">
      <button class="qa-btn" id="qa-task">＋ タスク追加</button>
      <button class="qa-btn" id="qa-list">📋 タスク一覧</button>
      <button class="qa-btn" id="qa-complete">✅ タスク完了</button>
      <button class="qa-btn" id="qa-insight">💡 気づき追加</button>
      <button class="qa-btn" id="qa-export">📤 気づきエクスポート</button>
      <button class="qa-btn" id="qa-update-priority">🔄 優先度修正</button>
      <button class="qa-btn" id="qa-update-due">📅 期日修正</button>
    </div>

    <footer class="chat-footer">
      <textarea
        id="user-input"
        class="chat-input"
        placeholder="メッセージを入力..."
        rows="1"
      ></textarea>
      <button id="send-btn" class="send-btn" aria-label="送信">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </footer>

  </div>
  <script src="main.js?v=4"></script>
</body>
</html>
